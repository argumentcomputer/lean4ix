name = "lean4lean"
license = "MIT OR Apache-2.0"
licenseFiles = ["LICENSE", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
defaultTargets = ["Lean4Lean", "lean4lean", "Lean4Lean.Theory", "Lean4Lean.Verify", "Lean4Lean.Tests"]

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.33.0"

[[require]]
scope = "leanprover"
name = "lean4export"
rev = "v4.30.0"

[[lean_lib]]
name = "Lean4Lean"

[[lean_lib]]
name = "Lean4Lean.Theory"
globs = ["Lean4Lean.Theory.*"]

[[lean_lib]]
name = "Lean4Lean.Verify"
globs = ["Lean4Lean.Verify.*"]

[[lean_lib]]
name = "Lean4Lean.Tests"
globs = ["Lean4Lean.Tests.*"]

[[lean_lib]]
name = "Lean4Lean.Experimental"
globs = ["Lean4Lean.Experimental.+"]

[[lean_exe]]
name = "lean4lean"
root = "Main"
supportInterpreter = true
