name: Nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Packaging-compatibility gate: build the shipped outputs and every flake
  # check on x86_64-linux (the only supported system). ci.yml is the primary
  # lean-action build and test. The other systems in flake.nix stay declared
  # but are not built here, so they never gate CI.
  nix-test:
    name: Nix Tests
    # /nix lives on the root volume; Cachix is the binary cache, so no sticky disk
    runs-on: runs-on=${{ github.run_id }}-nix-test-${{ github.run_attempt }}/cpu=8/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: argumentcomputer
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check formatting
        run: nix fmt --accept-flake-config -- --check flake.nix
      # Shipped outputs: the CLI and the downstream Lake-dependency artifact.
      - run: nix build --print-build-logs --accept-flake-config .#lean4lean .#lake-dependency
      # Builds every check (proofs + sorry frontier, tests, consumer fixture,
      # CLI regressions) and evaluates the rest of the flake.
      - run: nix flake check --print-build-logs --accept-flake-config

  # Verify the dev shell provides a working Lake toolchain.
  nix-devshell:
    name: Nix devShell
    # `lake build` below runs outside the Nix sandbox, so `.lake` can persist
    # on a sticky disk like ci.yml's
    runs-on: runs-on=${{ github.run_id }}-nix-devshell-${{ github.run_attempt }}/cpu=8/family=r7i+r8i+r7a+r8a/image=ubuntu26-full-x64/volume=100gb/sticky=nix-devshell:50gb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: runs-on/action@dfae4d98c5537a0dc7bbb7e6b9211f30ba240f6d # v2.4.0
        with:
          sticky_cache: |
            custom,path=.lake
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          github_access_token: ${{ github.token }}
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: argumentcomputer
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop --accept-flake-config --command bash -c "lake build"
